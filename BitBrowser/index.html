<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit Browser</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="browser-app">

        <!-- Title Bar -->
        <div class="titlebar" id="titlebar">
            <div class="titlebar-left">
                <div class="window-controls">
                    <button class="wc-btn wc-close" id="wc-close"></button>
                    <button class="wc-btn wc-minimize" id="wc-minimize"></button>
                    <button class="wc-btn wc-maximize" id="wc-maximize"></button>
                </div>
                <div class="brand">
                    <svg class="brand-icon" viewBox="0 0 24 24" width="18" height="18">
                        <defs>
                            <linearGradient id="bitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#60a5fa"/>
                                <stop offset="100%" style="stop-color:#a78bfa"/>
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#bitGrad)"/>
                        <text x="12" y="17" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="Inter,sans-serif">B</text>
                    </svg>
                    <span class="brand-name">Bit</span>
                </div>
            </div>
            <div class="titlebar-center" id="titlebar-drag"></div>
            <div class="titlebar-right">
                <button class="tb-btn" id="btn-devtools" title="DevTools">Dev</button>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tabbar">
            <div class="tabs" id="tabs-container"></div>
            <button class="newtab-btn" id="btn-newtab" title="New Tab (Ctrl+T)">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
            </button>
        </div>

        <!-- Navigation Bar -->
        <div class="navbar">
            <div class="nav-group">
                <button class="nav-btn" id="btn-back" title="Back (Alt+Left)">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <button class="nav-btn" id="btn-forward" title="Forward (Alt+Right)">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <button class="nav-btn" id="btn-refresh" title="Refresh (F5)">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <button class="nav-btn" id="btn-home" title="Home">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
            </div>

            <div class="address-bar-wrapper">
                <div class="address-bar" id="address-bar">
                    <svg class="address-icon" viewBox="0 0 24 24" width="14" height="14" id="address-icon"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    <input type="text" id="url-input" placeholder="Search or enter URL" autocomplete="off" spellcheck="false">
                    <button class="address-btn" id="btn-bookmark" title="Bookmark">
                        <svg viewBox="0 0 24 24" width="14" height="14" id="bookmark-icon"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    </button>
                </div>
            </div>

            <div class="nav-group">
                <button class="nav-btn" id="btn-downloads" title="Downloads">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="nav-btn" id="btn-menu" title="Menu">
                    <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
                </button>
            </div>
        </div>

        <!-- Bookmarks Bar -->
        <div class="bookmarks-bar" id="bookmarks-bar"></div>

        <!-- Content Area -->
        <div class="content-area" id="content-area"></div>

        <!-- Status Bar -->
        <div class="statusbar" id="statusbar">
            <span id="status-text">Ready</span>
            <span id="status-url"></span>
        </div>

        <!-- Menu Dropdown -->
        <div class="dropdown-menu hidden" id="menu-dropdown">
            <div class="dropdown-item" data-action="newtab">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                New Tab
            </div>
            <div class="dropdown-item" data-action="newwindow">
                <svg viewBox="0 0 24 24" width="14" height="14"><rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                New Window
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="bookmarks">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                Bookmarks
            </div>
            <div class="dropdown-item" data-action="history">
                <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="12 6 12 12 16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                History
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="zoomin">
                <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/><line x1="11" y1="8" x2="11" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Zoom In
            </div>
            <div class="dropdown-item" data-action="zoomout">
                <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/><line x1="8" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Zoom Out
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="print">
                <svg viewBox="0 0 24 24" width="14" height="14"><polyline points="6 9 6 2 18 2 18 9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2" stroke="currentColor" stroke-width="2" fill="none"/><rect x="6" y="14" width="12" height="8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                Print
            </div>
            <div class="dropdown-item" data-action="find">
                <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/></svg>
                Find in Page
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="settings">
                <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                Settings
            </div>
            <div class="dropdown-item" data-action="about">
                <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><line x1="12" y1="16" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="8" x2="12.01" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                About Bit Browser
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
